[project]
name = "pypi-toolkit"
version = "0.1.0"
description = "PyPI package portfolio management and auditing toolkit"
readme = "README.md"
authors = [
    { name = "Michael Borck", email = "michael.borck@curtin.edu.au" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["pypi", "package", "management", "audit", "cli"]

[project.urls]
Homepage = "https://github.com/michael-borck/pypi-toolkit"
Repository = "https://github.com/michael-borck/pypi-toolkit"
Issues = "https://github.com/michael-borck/pypi-toolkit/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "basedpyright>=1.12.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
pypi-toolkit = "pypi_toolkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
